<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VisaNet Payment Page</title>
<style>
    body {
        background: #f5f5f5;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
    }
    .circle {
        width: 230px;
        height: 230px;
        border-radius: 50%;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 42px;
        font-weight: bold;
        color: #003b8e;
        box-shadow: 0 0 20px rgba(0,0,0,0.12);
        position: relative;
        margin-bottom: 60px;
    }
    .icons-ring {
        position: absolute;
        width: 380px;
        height: 380px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }
    .icons-ring img {
        width: 58px;
        height: 58px;
        position: absolute;
    }
    #payBtn {
        background: #003b8e;
        color: white;
        padding: 16px 38px;
        border: none;
        font-size: 20px;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    }
    #payBtn:hover {
        opacity: 0.85;
    }
</style>
</head>
<body>

<div class="circle">
    VisaNet
    <div class="icons-ring">
        <img src="https://i.imgur.com/8zQpB0v.png" style="top:-10px; left:50%; transform:translateX(-50%);">
        <img src="https://i.imgur.com/0geQb1L.png" style="top:50%; left:-10px; transform:translateY(-50%);">
        <img src="https://i.imgur.com/U2ybU7g.png" style="bottom:-10px; left:50%; transform:translateX(-50%);">
        <img src="https://i.imgur.com/qE1OjJp.png" style="top:50%; right:-10px; transform:translateY(-50%);">
        <img src="https://i.imgur.com/p2f4YXj.png" style="top:18%; right:18%;">
        <img src="https://i.imgur.com/Y8LLS4c.png" style="top:18%; left:18%;">
        <img src="https://i.imgur.com/N6J05kU.png" style="bottom:18%; right:18%;">
        <img src="https://i.imgur.com/OU1TRl9.png" style="bottom:18%; left:18%;">
    </div>
</div>

<button id="payBtn">Pay Now</button>

<script>
fetch("payurl.json")
  .then(res => res.json())
  .then(data => {
    const PAY_URL = data.PAY_URL;
    document.getElementById("payBtn").addEventListener("click", () => {
      if (!PAY_URL) {
          alert("No payment URL found.");
          return;
      }
      window.location.href = PAY_URL;
    });
  })
  .catch(() => alert("Payment URL not found."));
</script>

</body>
</html>
